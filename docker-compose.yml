services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: phonematch-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: phonematch
      POSTGRES_PASSWORD: phonematch
      POSTGRES_DB: phonematch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phonematch -d phonematch"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phonematch-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3000
      - DATABASE_URL=postgresql://phonematch:phonematch@postgres:5432/phonematch?sslmode=disable
      - DATABASE_MAX_CONNECTIONS=5
      - ADMIN_KEY=${ADMIN_KEY:-your-admin-key-min-24-chars-long}
      - CRON_SECRET=${CRON_SECRET:-your-cron-secret-min-24-chars-long}
      - CREDENTIALS_ENC_KEY=${CREDENTIALS_ENC_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your-gemini-api-key}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      - GEMINI_DAILY_LIMIT=1500
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-your-youtube-api-key}
      - YOUTUBE_DAILY_LIMIT=10000
      - TICK_MAX_SECONDS=60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: phonematch-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - app-network

  # SonarQube opcional: execute com `docker compose --profile sonar up`
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    profiles:
      - sonar
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    depends_on:
      - postgres
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
